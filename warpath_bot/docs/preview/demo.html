    for(const row of fixKb(m.kb)){
      const r=document.createElement('div');r.className='row';
      for(const btn of row){const e=document.createElement('button');e.className='btn';e.textContent=btn.t+(btn.u?' ↗':'');e.onclick=()=>press(m.id,btn);r.appendChild(e)}
      w.appendChild(r);
    }
    chat.appendChild(w);
  }
  chat.scrollTop=chat.scrollHeight;
}
function botSay(s){msgs.push({id:++seq,text:s.text,kb:s.kb||[]})}
function command(cmd){
  msgs.push({me:cmd});
  if(cmd==='/favorites') botSay(favScreen());
  else if(cmd==='/profile') botSay(profileScreen());
  else botSay(DATA.commands[cmd]);
  render();
}
function press(mid,btn){
  const m=msgs.find(x=>x.id===mid);
  if(btn.u){toast('Откроется личный чат с ботом');return}
  const d=btn.d;
  if(d.startsWith('b:f:')){
    const id=+d.split(':')[2];
    if(favs.includes(id)){favs=favs.filter(x=>x!==id);toast('Убрано из избранного')}
    else{favs.unshift(id);toast('⭐ Добавлено в избранное')}
    render();return;
  }
  let s;
  if(d==='m:fav') s=favScreen();
  else if(d==='m:profile') s=profileScreen();
  else s=DATA.screens[d];
  if(!s){toast('В демо этот экран не записан');return}
  if(/^s:r:/.test(d)&&d.endsWith(':0')) searches++;
  if(s.text){m.text=s.text;m.kb=s.kb}   // как в Telegram: сообщение редактируется
  if(s.toast){s.alert?alertBox(s.toast):toast(s.toast)}
  render();
}
function reset(){favs=[];searches=0;msgs=[];command('/start')}
document.getElementById('reset').onclick=reset;
const cmds=document.getElementById('cmds');
for(const c of ['/start','/build','/favorites','/profile','/help','/admin']){const b=document.createElement('button');b.textContent=c;b.onclick=()=>command(c);cmds.appendChild(b)}
reset();
</script></body></html>
