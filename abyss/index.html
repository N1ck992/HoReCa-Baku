<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>ABYSS: LOST SIGNAL</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="screen" aria-label="Игровой экран"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div id="hud-room"></div>
      <div id="hud-hp" aria-label="Здоровье"></div>
    </div>
    <div class="hud-buttons">
      <button id="btn-inv" class="hud-btn" title="Инвентарь (I)">Инвентарь</button>
      <button id="btn-ids" class="hud-btn" title="Показать или скрыть ID заглушек">ID</button>
      <button id="btn-menu" class="hud-btn" aria-label="Меню">☰</button>
    </div>
  </div>

  <div id="title">
    <h1>ABYSS</h1>
    <p>LOST SIGNAL</p>
  </div>

  <div id="prompt"></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <button id="btn-skip" hidden>Пропустить ▸▸</button>

  <div id="touch">
    <div class="pad">
      <button data-touch="left" aria-label="Влево">◀</button>
      <button data-touch="right" aria-label="Вправо">▶</button>
    </div>
    <div class="pad">
      <button data-touch="run" aria-label="Бег">»</button>
      <button data-touch="action" aria-label="Действие">◉</button>
    </div>
  </div>

  <div id="inventory" hidden>
    <div class="inv-card" role="dialog" aria-label="Инвентарь">
      <div class="inv-head">
        <div>
          <h2>Инвентарь</h2>
          <div class="muted" id="inv-owner"></div>
        </div>
        <button class="hud-btn" data-inv-close aria-label="Закрыть">✕</button>
      </div>
      <div class="inv-body">
        <div id="inv-grid"></div>
        <div id="inv-detail"></div>
      </div>
    </div>
  </div>

  <div id="menu" hidden>
    <div class="menu-card">
      <h2>ABYSS: LOST SIGNAL</h2>
      <p class="muted">Прототип v0.2 · этапы 1–4 из GDD.<br>Графика — временные заглушки с ID ресурсов.</p>
      <button id="btn-close-menu">Продолжить</button>
      <button id="btn-restart" class="danger">Начать заново</button>
    </div>
  </div>

  <!-- Ядро -->
  <script src="js/core/ids.js"></script>
  <!-- Данные (реестры по ID) -->
  <script src="js/data/assets.manifest.js"></script>
  <script src="js/data/animations.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/rooms.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/data/items.js"></script>
  <!-- Системы -->
  <script src="js/systems/asset-manager.js"></script>
  <script src="js/systems/animation-manager.js"></script>
  <script src="js/systems/input.js"></script>
  <script src="js/systems/character-system.js"></script>
  <script src="js/systems/room-system.js"></script>
  <script src="js/systems/story-events.js"></script>
  <script src="js/systems/inventory.js"></script>
  <script src="js/systems/interaction.js"></script>
  <script src="js/systems/save-system.js"></script>
  <!-- Отрисовка и запуск -->
  <script src="js/render/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
